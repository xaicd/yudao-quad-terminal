# deploy/gateway/nginx/${slug}.conf
# Nginx / OpenResty 站点片段（经典政企 / 传统物理机多端微服务架构）
# 项目: ${slug}
# 架构: Spring Boot (${BACKEND_PORT:-48080}) + Vue3 Admin (${FRONTEND_PORT:-48121}) + UniApp H5 (${MINIAPP_PORT:-48122})

# 1. C端前台商城 (/${slug}/2c/) -> 端口 48122
location /${slug}/2c/ {
    proxy_pass http://127.0.0.1:48122/${slug}/2c/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# 2. B端管理中台 (/${slug}/admin/ 与 /${slug}/) -> 端口 48121
location /${slug}/admin/ {
    proxy_pass http://127.0.0.1:48121/${slug}/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# 3. 后端管理与业务 API 契约 (/${slug}/admin-api/*, /${slug}/app-api/*, /${slug}/open-api/*) -> 端口 48080
# 关键防坑：API 契约未命中必须返回 404 JSON，严禁被前端 SPA 通配兜底成 HTML 200
location /${slug}/admin-api/ {
    proxy_pass http://127.0.0.1:48080/admin-api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_intercept_errors on;
    error_page 404 = @${slug}_api_404;
}
location /${slug}/app-api/ {
    proxy_pass http://127.0.0.1:48080/app-api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_intercept_errors on;
    error_page 404 = @${slug}_api_404;
}
location /${slug}/open-api/ {
    proxy_pass http://127.0.0.1:48080/open-api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_intercept_errors on;
    error_page 404 = @${slug}_api_404;
}
location @${slug}_api_404 {
    default_type application/json;
    return 404 '{"code":404,"msg":"接口不存在","error":"GATEWAY_NO_SUCH_API"}';
}

# 4. 项目根重定向
location = /${slug} {
    return 308 /${slug}/admin/;
}
location = /${slug}/ {
    return 308 /${slug}/admin/;
}
