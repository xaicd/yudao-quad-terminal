# ==============================================================================
# [yudao] 工业级标准 Nginx 反代配置 (自动生成，放置于 /etc/nginx/conf.d/)
# 单一入口标准: http://<server_name>/yudao/
# ==============================================================================

upstream yudao_backend {
    server 127.0.0.1:48080;
    keepalive 32;
}

location = /yudao {
    return 301 /yudao/2c/;
}
location = /yudao/ {
    return 301 /yudao/2c/;
}

# 1. 领导驾驶舱平面 (/cockpit/)
location /yudao/cockpit/ {
    alias /Users/mac/workspace/xaicd/yudao-quad-terminal/apps/admin/dist/;
    index index.html;
    try_files $uri $uri/ /yudao/cockpit/index.html;
}

# 2. C端移动 H5 平面 (/2c/)
location /yudao/2c/ {
    alias /Users/mac/workspace/xaicd/yudao-quad-terminal/apps/miniapp/dist/build/h5/;
    index index.html;
    try_files $uri $uri/ /yudao/2c/index.html;
}

# 3. B端管理后台前端 (/admin/)
location /yudao/admin/ {
    alias /Users/mac/workspace/xaicd/yudao-quad-terminal/apps/admin/dist/;
    index index.html;
    try_files $uri $uri/ /yudao/admin/index.html;
}

# 4. 后端管理端 API 穿透 (/admin-api/)
location /yudao/admin-api/ {
    proxy_pass http://yudao_backend/admin-api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header tenant-id 1;
    proxy_read_timeout 60s;
}
location /admin-api/ {
    proxy_pass http://yudao_backend/admin-api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header tenant-id 1;
    proxy_read_timeout 60s;
}

# 5. 后端移动端 API 穿透 (/app-api/)
location /yudao/app-api/ {
