name: quality-gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: quality-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 秒级门禁：无需构建、无网络依赖（typecheck 与 scripts-tests 需要 pnpm 在 PATH 上，故必须 corepack enable）。
  fast-gates:
    name: Fast Gates (contract / jdk-variants / submodule-patches / ci-files / ...)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # gate-check 内部会 spawn `pnpm typecheck` 与 `pnpm test:scripts`；不启用 corepack 时
      # pnpm 不在 PATH 上，这些门禁会直接失败（CI 会红在"找不到 pnpm"而不是真实问题上）。
      - name: Enable pnpm (corepack)
        run: |
          corepack enable
          pnpm --version

      - name: Run fast gate chain
        run: node scripts/gate-check.mjs --tier fast

  # harness 自证：下游兼容契约 + 门禁反向控制（证明每道门禁真的会咬人）。
  harness-proof:
    name: Harness Proof (compat contract + negative controls)
    runs-on: ubuntu-latest
    needs: fast-gates
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm (corepack)
        run: corepack enable

      - name: Downstream compatibility contract
        run: node scripts/compat-check.mjs

      - name: Negative controls (every blocking gate must bite)
        run: node scripts/harness/negative-controls.mjs

  # 端到端：lite 档零 Docker 验收（嵌入式 PG + 嵌入式 Redis + 真实登录）
  lite-e2e:
    name: Lite E2E (zero-Docker boot + login)
    runs-on: ubuntu-latest
    needs: fast-gates
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Enable pnpm (corepack)
        run: corepack enable

      - name: Install lite runtime deps
        working-directory: deploy/lite/runtime
        run: pnpm install --frozen-lockfile

      - name: Build fat jar (two-step: plain module jars, then repackage yudao-server)
        working-directory: apps/backend
        run: |
          # 单条 package 会产出「fat jar 套 fat jar」，导致模块 bean 与 Mapper 全部扫描不到
          mvn -B clean install -DskipTests -pl yudao-server -am -Dspring-boot.repackage.skip=true
          mvn -B package -DskipTests -pl yudao-server

      - name: Lite end-to-end verification
        run: node scripts/lite-up.mjs --verify
