name: quality-gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: quality-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-gates:
    name: Fast Gates (contract / jdk-variants / submodule-patches / ci-files / ...)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Sync full multi-branch refs and tags in read-only submodules
        run: |
          for sub in apps/backend apps/admin apps/miniapp; do
            git -C "$sub" config remote.origin.fetch "+refs/heads/*:refs/remotes/origin/*"
            if [ "$(git -C "$sub" rev-parse --is-shallow-repository)" = "true" ]; then
              git -C "$sub" fetch --unshallow --tags origin "+refs/heads/*:refs/remotes/origin/*"
            else
              git -C "$sub" fetch --tags origin "+refs/heads/*:refs/remotes/origin/*"
            fi
          done

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm (corepack)
        run: |
          corepack enable
          pnpm --version

      - name: Apply declarative submodule patches
        run: node scripts/submodule-patches.mjs --apply

      - name: Install workspace and lite runtime dependencies
        run: |
          pnpm install --frozen-lockfile --registry=https://registry.npmjs.org/
          pnpm --dir deploy/lite/runtime install --frozen-lockfile --registry=https://registry.npmjs.org/

      - name: Run fast gate chain
        run: node scripts/gate-check.cjs --tier fast

  harness-proof:
    name: Harness Proof (compat contract + negative controls + hatch smoke)
    runs-on: ubuntu-latest
    needs: fast-gates
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Sync full multi-branch refs and tags in read-only submodules
        run: |
          for sub in apps/backend apps/admin apps/miniapp; do
            git -C "$sub" config remote.origin.fetch "+refs/heads/*:refs/remotes/origin/*"
            if [ "$(git -C "$sub" rev-parse --is-shallow-repository)" = "true" ]; then
              git -C "$sub" fetch --unshallow --tags origin "+refs/heads/*:refs/remotes/origin/*"
            else
              git -C "$sub" fetch --tags origin "+refs/heads/*:refs/remotes/origin/*"
            fi
          done

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm (corepack)
        run: corepack enable

      - name: Apply declarative submodule patches
        run: node scripts/submodule-patches.mjs --apply

      - name: Install workspace and lite runtime dependencies
        run: |
          pnpm install --frozen-lockfile --registry=https://registry.npmjs.org/
          pnpm --dir deploy/lite/runtime install --frozen-lockfile --registry=https://registry.npmjs.org/

      - name: Downstream compatibility contract
        run: node scripts/compat-check.cjs

      - name: Negative controls (every blocking gate must bite)
        run: node scripts/harness/negative-controls.mjs

      - name: Hatch golden path (derive a project and assert 20 invariants)
        run: node scripts/harness/hatch-smoke.mjs

  lite-e2e:
    name: Lite E2E (zero-Docker boot + login)
    runs-on: ubuntu-latest
    needs: fast-gates
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Sync full multi-branch refs and tags in read-only submodules
        run: |
          for sub in apps/backend apps/admin apps/miniapp; do
            git -C "$sub" config remote.origin.fetch "+refs/heads/*:refs/remotes/origin/*"
            if [ "$(git -C "$sub" rev-parse --is-shallow-repository)" = "true" ]; then
              git -C "$sub" fetch --unshallow --tags origin "+refs/heads/*:refs/remotes/origin/*"
            else
              git -C "$sub" fetch --tags origin "+refs/heads/*:refs/remotes/origin/*"
            fi
          done

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Enable pnpm (corepack)
        run: corepack enable

      - name: Apply declarative submodule patches
        run: node scripts/submodule-patches.mjs --apply

      - name: Install lite runtime deps
        working-directory: deploy/lite/runtime
        run: pnpm install --frozen-lockfile --registry=https://registry.npmjs.org/

      - name: "Build fat jar (two-step: plain module jars, then repackage yudao-server)"
        working-directory: apps/backend
        run: |
          mvn -B clean install -DskipTests -pl yudao-server -am -Dspring-boot.repackage.skip=true
          mvn -B package -DskipTests -pl yudao-server

      - name: Lite end-to-end verification
        run: node scripts/lite-up.mjs --verify
