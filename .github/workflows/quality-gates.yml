name: quality-gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: quality-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 秒级门禁：无需构建、无网络。blocking 失败即红。
  fast-gates:
    name: Fast Gates (openwiki / skills / workflow / trim-cli)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run fast gate chain
        run: node scripts/gate-check.mjs --tier fast

  # 端到端：lite 档零 Docker 验收（嵌入式 PG + 嵌入式 Redis + 真实登录）
  lite-e2e:
    name: Lite E2E (zero-Docker boot + login)
    runs-on: ubuntu-latest
    needs: fast-gates
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Install lite runtime deps
        working-directory: deploy/lite/runtime
        run: pnpm install --frozen-lockfile

      - name: Build fat jar (two-step: plain module jars, then repackage yudao-server)
        working-directory: apps/backend
        run: |
          # 单条 package 会产出「fat jar 套 fat jar」，导致模块 bean 与 Mapper 全部扫描不到
          mvn -B clean install -DskipTests -pl yudao-server -am -Dspring-boot.repackage.skip=true
          mvn -B package -DskipTests -pl yudao-server

      - name: Lite end-to-end verification
        run: node scripts/lite-up.mjs --verify
