# Yudao Quad-Terminal 活体业务本体注册表 (Living Ontology Specification)
# 对标 CMMI 高成熟度工程资产与 Layer B Gate G8-1 规范

platform: "yudao-quad-terminal"
version: "1.2.0"
architecture: "Java 17 + Spring Boot 3 + MyBatis-Plus + Vue3 Admin + UniApp + Expo"
lastUpdated: "2026-11-16"

# M1: 核心领域实体 (Object Types)
M1_Objects:
  - key: "system_user"
    name: "系统用户与数字员工"
    description: "企业用户实体，具备部门关联、角色权限集合与租户多级隔离属性"
    table: "system_users"
    properties:
      - name: "id"
        type: "Long"
        primary: true
        description: "用户唯一ID"
      - name: "username"
        type: "String"
        required: true
        description: "用户登录账号"
      - name: "nickname"
        type: "String"
        required: true
        description: "用户显示昵称"
      - name: "dept_id"
        type: "Long"
        required: true
        description: "归属部门 ID"
      - name: "status"
        type: "Integer"
        required: true
        description: "账号状态 (0:正常 1:停用)"
      - name: "tenant_id"
        type: "Long"
        required: true
        description: "多租户行级隔离 ID"

  - key: "system_role"
    name: "RBAC 权限角色"
    description: "角色控制实体，承载菜单操作权限与数据范围隔离规则"
    table: "system_role"
    properties:
      - name: "id"
        type: "Long"
        primary: true
        description: "角色唯一ID"
      - name: "name"
        type: "String"
        required: true
        description: "角色名称"
      - name: "code"
        type: "String"
        required: true
        description: "角色权限编码"
      - name: "data_scope"
        type: "Integer"
        required: true
        description: "数据范围 (1:全部 2:自定义 3:本部门 4:本部门及以下 5:仅本人)"
      - name: "tenant_id"
        type: "Long"
        required: true
        description: "多租户行级隔离 ID"

  - key: "system_tenant"
    name: "企业租户隔离域"
    description: "多租户系统最高隔离维度，行级数据物理与逻辑隔离"
    table: "system_tenant"
    properties:
      - name: "id"
        type: "Long"
        primary: true
        description: "租户唯一ID"
      - name: "name"
        type: "String"
        required: true
        description: "租户企业全称"
      - name: "package_id"
        type: "Long"
        required: true
        description: "开通功能套餐 ID"
      - name: "status"
        type: "Integer"
        required: true
        description: "租户开通状态 (0:正常 1:停用)"

  - key: "system_dept"
    name: "企业组织部门"
    description: "组织架构树状部门实体，用于数据权限垂直穿透"
    table: "system_dept"
    properties:
      - name: "id"
        type: "Long"
        primary: true
        description: "部门ID"
      - name: "name"
        type: "String"
        required: true
        description: "部门名称"
      - name: "parent_id"
        type: "Long"
        required: true
        description: "父部门ID"
      - name: "tenant_id"
        type: "Long"
        required: true
        description: "租户隔离 ID"

# M2: 核心业务行为动词 (Action Types)
M2_Behaviors:
  - action: "system:user:create"
    name: "新增系统用户"
    targetEntity: "system_user"
    preconditions:
      - "操作者拥有 system:user:create 权限"
      - "用户名在该租户内保持全局唯一"
    postconditions:
      - "持久化系统用户记录并自动写入创建人审计底座字段"

  - action: "system:user:update-status"
    name: "启停用户账号"
    targetEntity: "system_user"
    preconditions:
      - "不允许停用当前登录会话中的自身账号"
    postconditions:
      - "状态机流转为 0(正常) 或 1(停用)，强踢已吊销 Token"

  - action: "system:role:assign-menu"
    name: "角色赋权"
    targetEntity: "system_role"
    preconditions:
      - "角色非系统内置保护超级管理员"
    postconditions:
      - "刷新并重建角色与菜单映射，触发缓存失效"

# M3: 架构业务不变量 (Defensive Invariants)
M3_Invariants:
  - id: "INV-TENANT-ISOLATION"
    name: "多租户行级强制隔离不变量"
    rule: "所有业务表与系统表均必须包含 tenant_id，由 MyBatis-Plus 租户插件全局自动注入过滤，严禁越权跨租户读写"
  - id: "INV-AUDIT-COLUMNS"
    name: "8 大底座审计字段守恒不变量"
    rule: "业务表必须继承 BaseDO (id, creator, create_time, updater, update_time, deleted, tenant_id)"
  - id: "INV-READONLY-SANDBOX"
    name: "AI 只读安全沙箱不变量"
    rule: "前端 Copilot 与只读查询仅允许 SELECT/WITH 语句，严禁触发 DDL/DML 与系统敏感表"

# M5: 参与者与角色矩阵 (Actors / Principals)
M5_Actors:
  - code: "super_admin"
    name: "超级管理总控"
  - code: "tenant_admin"
    name: "企业租户管理员"
  - code: "operator"
    name: "前台业务操作员"
  - code: "digital_employee"
    name: "AI 数字员工 (Hermes/墨斗/铁匠/门神)"

# M6: 状态机流转图 (State Machine Workflows)
M6_Stateflows:
  - entity: "system_user"
    field: "status"
    states:
      - value: 0
        label: "正常"
        allowTransitions: [1]
      - value: 1
        label: "停用"
        allowTransitions: [0]
  - entity: "system_tenant"
    field: "status"
    states:
      - value: 0
        label: "正常"
        allowTransitions: [1]
      - value: 1
        label: "已锁定"
        allowTransitions: [0]

# MU: 前端交互动作规范 (UI Actions & Copilot)
MU_UI:
  zeroDeadButtonsStrict: true
  copilotDrawerEnabled: true
  whiteLabelPurityEnforced: true
